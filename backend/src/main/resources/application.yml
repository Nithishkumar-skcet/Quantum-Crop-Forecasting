server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: quantum-crop-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:quantum_crop_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Mysql@2135}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:QuantumCropYieldForecastingSystemSuperSecretKey2026TN}
    expiration-ms: 86400000 # 24 hours
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
